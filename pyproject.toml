[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-invoice-data-extraction"
version = "0.1.0"
description = "Invoice field extraction using YOLOv8, OCR, NER, and rule-based post-processing."
requires-python = ">=3.9"
dependencies = [
    "ultralytics",
    "opencv-python",
    "pytesseract",
    "spacy",
    "spacy-transformers",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
